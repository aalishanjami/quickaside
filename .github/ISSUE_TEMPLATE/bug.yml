name: Bug
description: Something doesn't work the way it should
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting this. Please leave out real transcripts, client names and anything else private. Security problems go through [SECURITY.md](https://github.com/aalishanjami/callaside/blob/main/SECURITY.md) instead.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: And what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How can we see it happen?
      description: The steps, and which call app you were using, like Zoom, Meet or Slack.
      placeholder: |
        1. Start a call in Zoom
        2. Press Start on the prompt
        3. ...
    validations:
      required: true
  - type: textarea
    id: report
    attributes:
      label: Report a problem output
      description: In Callaside, open Settings > Help, press Copy all and paste it here. It holds versions, status and the recent log, and never transcripts. Check it before you send it.
      render: text
    validations:
      required: true
