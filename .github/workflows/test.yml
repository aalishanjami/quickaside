name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Check shell scripts parse on macOS's bash 3.2
        run: for f in setup.sh scripts/*.sh; do /bin/bash -n "$f"; done
