<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'" />
    <title>Past calls</title>
    <link rel="stylesheet" href="theme.css" />
    <link rel="stylesheet" href="library.css" />
  </head>
  <body>
    <aside class="side">
      <input id="search" type="search" placeholder="Search your calls" spellcheck="false" aria-label="Search your calls" />
      <ul class="list" id="list"></ul>
      <p class="list-empty" id="listEmpty" hidden></p>
    </aside>

    <main class="detail">
      <form class="ask" id="askForm" autocomplete="off">
        <input id="askInput" type="text" placeholder="Ask across all your calls" aria-label="Ask across all your calls" />
        <button class="btn" id="askBtn" type="submit">Ask</button>
      </form>
      <section class="ask-result" id="askResult" hidden>
        <div class="md" id="askAnswer"></div>
        <div class="ask-from" id="askFrom"></div>
        <button class="text-btn" id="askClose" type="button">Close</button>
      </section>
      <div class="call" id="call"></div>
    </main>

    <div class="toasts" id="toasts" aria-live="polite"></div>

    <script src="ui.js"></script>
    <script src="markdown.js"></script>
    <script src="library.js"></script>
  </body>
</html>
